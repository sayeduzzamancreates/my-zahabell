<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>

    <style>

            display: block;

        .card{

            border: 5px solid rgb(0, 45, 75);
            padding: 10px;
            border-radius: 20px;

        }
        .text{
            text-align: center;
            color: rgb(49, 0, 0);
        }
    </style>
</head>
<body>
    <h2 style="background-color: burlywood;">Select a design</h2>
    <div class="card">
        <h5 class="text">Design 01</h5>
        <img sizes="50px 12px"  src="img/ZB1.jpg" alt="Zahabell design 01" class="imgg">
    </div>
    <div class="card">
        <h5 class="text" >Design 02</h5>
        <img src="img/zb2.jpg" alt="" class="imgg">

    </div>
    <div class="card">
        <h5 class="text">Design 03</h5>
        <img src="img/zb3.jpg" alt="" class="imgg">

    </div>
    <div class="card">
        <h5 class="text">Design 04</h5>
        <img src="img/zb4.jpg" alt="" class="imgg">

    </div>

</html>
